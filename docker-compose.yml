services:
  diting-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WEBUI_IMAGE:-diting-web-ui-local:latest}
    container_name: ${WEBUI_CONTAINER_NAME:-diting-webui}
    ports:
      - "${DITING_WEB_PORT:-16060}:6060"
      - "${DITING_PREVIEW_PORT:-18651}:8651"
      - "${DITING_XAI_OAUTH_PORT:-56122}:56121"
    volumes:
      - ${DiTing_HOME_DIR:-./diting_data}:/home/agent/.diting
      - ${DiTing_WEB_UI_HOME_DIR:-./diting_webui_data}:/home/agent/.diting-web-ui
    environment:
      - PORT=6060
      - BIND_HOST=0.0.0.0
      - DiTing_HOME=/home/agent/.diting
      - DiTing_WEB_UI_HOME=/home/agent/.diting-web-ui
      - DiTing_ACTIVE_PROFILE=${DiTing_ACTIVE_PROFILE:-default}
      - DiTing_DOCKER_REQUIRE_PROFILE_CONFIG=${DiTing_DOCKER_REQUIRE_PROFILE_CONFIG:-0}
      - DiTing_WEB_UI_MANAGED_GATEWAY=1
      - DiTing_WEB_UI_REQUIRE_AGENT_BRIDGE=1
      - DiTing_AGENT_BRIDGE_ENDPOINT=tcp://127.0.0.1:28765
      - DiTing_AGENT_BRIDGE_AUTO_RESTART=1
      - DiTing_AGENT_BRIDGE_WORKER_TRANSPORT=tcp
      - DiTing_AGENT_BRIDGE_WORKER_PORT_BASE=28780
      - DiTing_AGENT_BRIDGE_WARM_PROFILES=${DiTing_AGENT_BRIDGE_WARM_PROFILES:-active}
      - DiTing_AGENT_BRIDGE_WORKER_IDLE_TIMEOUT_SECONDS=${DiTing_AGENT_BRIDGE_WORKER_IDLE_TIMEOUT_SECONDS:-86400}
      - DiTing_AGENT_BRIDGE_SESSION_IDLE_TIMEOUT_SECONDS=${DiTing_AGENT_BRIDGE_SESSION_IDLE_TIMEOUT_SECONDS:-86400}
      - DiTing_WEB_UI_XAI_CALLBACK_BIND_HOST=0.0.0.0
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
